services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pocketpilot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: pocketpilot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until ollama list >/dev/null 2>&1; do sleep 2; done &&
      ollama pull qwen2.5:1.5b &&
      ollama pull nomic-embed-text:v1.5"
    restart: "no"

  firebase-emulators:
    build:
      context: .
      dockerfile: docker/firebase-emulators.Dockerfile
    container_name: pocketpilot-firebase
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_CHAT_MODEL: "qwen2.5:1.5b"
      OLLAMA_EMBED_MODEL: "nomic-embed-text:v1.5"
      QDRANT_URL: "http://qdrant:6333"
    depends_on:
      - qdrant
      - ollama
    volumes:
      - firebase_emulator_data:/workspace/backend/firebase/.emulator-data
    ports:
      - "4000:4000"
      - "5001:5001"
      - "8080:8080"
      - "9099:9099"
    restart: unless-stopped

  categorization-service:
    build:
      context: .
      dockerfile: docker/rust-service.Dockerfile
      args:
        SERVICE_BIN: categorization-service
    container_name: pocketpilot-categorization
    environment:
      PORT: "8088"
      POCKETPILOT_PROJECT_ID: "demo-pocketpilot"
      FIREBASE_AUTH_EMULATOR_HOST: "firebase-emulators:9099"
      FIRESTORE_EMULATOR_HOST: "firebase-emulators:8080"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_CHAT_MODEL: "qwen2.5:1.5b"
      OLLAMA_EMBED_MODEL: "nomic-embed-text:v1.5"
    depends_on:
      - firebase-emulators
      - ollama
    ports:
      - "8088:8088"
    restart: unless-stopped

  rag-service:
    build:
      context: .
      dockerfile: docker/rust-service.Dockerfile
      args:
        SERVICE_BIN: rag-service
    container_name: pocketpilot-rag
    environment:
      PORT: "8089"
      POCKETPILOT_PROJECT_ID: "demo-pocketpilot"
      FIREBASE_AUTH_EMULATOR_HOST: "firebase-emulators:9099"
      FIRESTORE_EMULATOR_HOST: "firebase-emulators:8080"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_CHAT_MODEL: "qwen2.5:1.5b"
      OLLAMA_EMBED_MODEL: "nomic-embed-text:v1.5"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "pocketpilot_vectors_v2"
    depends_on:
      - firebase-emulators
      - qdrant
      - ollama
    ports:
      - "8089:8089"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: pocketpilot-web
    environment:
      VITE_FIREBASE_API_KEY: "demo-api-key"
      VITE_FIREBASE_AUTH_DOMAIN: "demo-pocketpilot.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "demo-pocketpilot"
      VITE_FIREBASE_APP_ID: "1:000000000000:web:local"
      VITE_USE_FIREBASE_EMULATORS: "true"
      VITE_FUNCTIONS_BASE_URL: "http://127.0.0.1:5001/demo-pocketpilot/us-central1"
      VITE_CATEGORIZATION_SERVICE_URL: "http://127.0.0.1:8088"
      VITE_RAG_SERVICE_URL: "http://127.0.0.1:8089"
    depends_on:
      - firebase-emulators
      - categorization-service
      - rag-service
    ports:
      - "5173:5173"
    restart: unless-stopped

  mobile:
    build:
      context: .
      dockerfile: docker/mobile.Dockerfile
    container_name: pocketpilot-mobile
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
      EXPO_PACKAGER_HOSTNAME: "0.0.0.0"
      EXPO_NO_USE_RANDOM_PORTS: "true"
    command: ["npm", "--prefix", "apps/mobile", "run", "start", "--", "--host", "0.0.0.0"]
    depends_on:
      - firebase-emulators
      - categorization-service
      - rag-service
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/workspace:cached
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
  firebase_emulator_data:
