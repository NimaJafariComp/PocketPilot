<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1F3D"/>
      <stop offset="100%" stop-color="#0B1730"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="ps" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="bs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGrad)"/>

  <!-- Subtle glow behind money cluster -->
  <ellipse cx="690" cy="650" rx="180" ry="130" fill="#16a34a" opacity="0.08"/>

  <!-- ══════════════════════════════ -->
  <!--  MONEY BILLS — pouring out   -->
  <!-- ══════════════════════════════ -->

  <!-- Bill 5 — farthest, smallest -->
  <g transform="translate(700,710) rotate(28)" filter="url(#bs)" opacity="0.55">
    <rect x="-42" y="-26" width="84" height="52" rx="7" fill="#14532d"/>
    <rect x="-34" y="-19" width="68" height="38" rx="4" fill="none" stroke="#166534" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#86efac">$</text>
  </g>

  <!-- Bill 4 — right, medium -->
  <g transform="translate(768,642) rotate(-10)" filter="url(#bs)" opacity="0.72">
    <rect x="-54" y="-33" width="108" height="66" rx="9" fill="#166534"/>
    <rect x="-45" y="-25" width="90" height="50" rx="5" fill="none" stroke="#15803d" stroke-width="2.5"/>
    <text x="0" y="9" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-weight="bold" fill="#bbf7d0">$</text>
  </g>

  <!-- Bill 3 — lower center -->
  <g transform="translate(628,724) rotate(32)" filter="url(#bs)" opacity="0.82">
    <rect x="-60" y="-36" width="120" height="72" rx="10" fill="#15803d"/>
    <rect x="-50" y="-27" width="100" height="54" rx="6" fill="none" stroke="#16a34a" stroke-width="2.5"/>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="bold" fill="#bbf7d0">$</text>
  </g>

  <!-- Bill 2 — upper right of cluster -->
  <g transform="translate(730,565) rotate(-16)" filter="url(#bs)" opacity="0.90">
    <rect x="-68" y="-41" width="136" height="82" rx="11" fill="#16a34a"/>
    <rect x="-57" y="-32" width="114" height="64" rx="6" fill="none" stroke="#22c55e" stroke-width="3"/>
    <text x="0" y="11" text-anchor="middle" font-family="Georgia,serif" font-size="40" font-weight="bold" fill="#dcfce7">$</text>
  </g>

  <!-- Bill 1 — largest, front and center -->
  <g transform="translate(646,638) rotate(6)" filter="url(#bs)">
    <rect x="-82" y="-50" width="164" height="100" rx="13" fill="#22c55e"/>
    <rect x="-70" y="-40" width="140" height="80" rx="8" fill="none" stroke="#4ade80" stroke-width="3.5"/>
    <ellipse cx="0" cy="0" rx="27" ry="21" fill="none" stroke="#4ade80" stroke-width="2.5"/>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia,serif" font-size="48" font-weight="bold" fill="#f0fdf4">$</text>
  </g>

  <!-- ══════════════════════════════ -->
  <!--  AIRPLANE — ascending         -->
  <!-- ══════════════════════════════ -->
  <g transform="translate(488,452) rotate(-22)" filter="url(#ps)">

    <!-- Fuselage -->
    <ellipse cx="25" cy="0" rx="295" ry="54" fill="url(#planeGrad)"/>

    <!-- Nose -->
    <path d="M 295 -28 C 322 -16 365 -6 378 0 C 365 6 322 16 295 28 Z" fill="#ffffff"/>

    <!-- Cockpit windows -->
    <ellipse cx="238" cy="-25" rx="20" ry="13" fill="#0B1730" opacity="0.55"/>
    <ellipse cx="200" cy="-28" rx="15" ry="10" fill="#0B1730" opacity="0.45"/>

    <!-- Main wing — upper -->
    <path d="M 55 -16 L -28 -232 L -118 -228 L -96 -16 Z" fill="#f1f5f9"/>
    <!-- Main wing — lower -->
    <path d="M 55 16 L -28 232 L -118 228 L -96 16 Z" fill="#f1f5f9"/>

    <!-- Wing root -->
    <ellipse cx="-18" cy="0" rx="28" ry="20" fill="#ffffff"/>

    <!-- Engine — upper -->
    <rect x="-82" y="-185" width="112" height="44" rx="22" fill="#cbd5e1"/>
    <ellipse cx="-82" cy="-163" rx="22" ry="22" fill="#94a3b8"/>
    <ellipse cx="30" cy="-163" rx="14" ry="14" fill="#64748b"/>

    <!-- Engine — lower -->
    <rect x="-82" y="141" width="112" height="44" rx="22" fill="#cbd5e1"/>
    <ellipse cx="-82" cy="163" rx="22" ry="22" fill="#94a3b8"/>
    <ellipse cx="30" cy="163" rx="14" ry="14" fill="#64748b"/>

    <!-- Horizontal tail — upper -->
    <path d="M -242 -10 L -296 -96 L -322 -91 L -274 -10 Z" fill="#e2e8f0"/>
    <!-- Horizontal tail — lower -->
    <path d="M -242 10 L -296 96 L -322 91 L -274 10 Z" fill="#e2e8f0"/>

    <!-- Vertical tail fin -->
    <path d="M -212 -12 L -250 -128 L -282 -106 L -250 -12 Z" fill="#f1f5f9"/>

    <!-- Fuselage windows -->
    <g fill="#0B1730" opacity="0.22">
      <rect x="176" y="-19" width="20" height="13" rx="4"/>
      <rect x="138" y="-19" width="20" height="13" rx="4"/>
      <rect x="100" y="-19" width="20" height="13" rx="4"/>
      <rect x="62"  y="-19" width="20" height="13" rx="4"/>
      <rect x="24"  y="-19" width="20" height="13" rx="4"/>
      <rect x="-14" y="-19" width="20" height="13" rx="4"/>
      <rect x="-52" y="-19" width="20" height="13" rx="4"/>
      <rect x="-90" y="-19" width="20" height="13" rx="4"/>
      <rect x="-128" y="-19" width="20" height="13" rx="4"/>
      <rect x="-166" y="-19" width="20" height="13" rx="4"/>
    </g>

    <!-- Belly cargo door hint (where money exits) -->
    <rect x="-40" y="36" width="120" height="18" rx="9" fill="#94a3b8" opacity="0.5"/>
  </g>
</svg>
